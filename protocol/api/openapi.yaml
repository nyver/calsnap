openapi: 3.0.3
info:
  title: CalSnap API
  version: v1
  description: |
    Stateless backend for CalSnap. It analyzes one meal photo, optionally
    together with a second photo of the same meal taken from the side, and
    returns recognized foods with estimated weights and nutrition per 100 g.
    It also looks packaged products up by barcode and reads the nutrition
    facts table on a package photo. Images are processed in
    memory only and are never stored.
servers:
  - url: https://calsnap.example.com
paths:
  /v1/meals/analyze:
    post:
      operationId: analyzeMeal
      summary: Analyze a meal photo (optionally with a side view)
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Exactly one JPEG, PNG or WebP file (detected by content). The meal seen from above.
                sideImage:
                  type: string
                  format: binary
                  description: |
                    Optional second photo of the same meal taken from the side, same
                    formats and size limit as `image`. It helps to judge the height and
                    volume of bulky foods. Servers that advertise `maxImages` 1 (or omit
                    it) in `/v1/config` reject it, so clients send it only when
                    `maxImages` is 2. The request counts as one request for rate limiting.
                plateDiameterCm:
                  type: number
                  minimum: 10
                  maximum: 40
                  description: Optional plate diameter used as sizing context.
                locale:
                  type: string
                  enum: [ru, en]
                  description: Locale of returned display names. Unknown values fall back to `en`.
      responses:
        '200':
          description: Analysis result. An empty `items` array with `NO_FOOD_DETECTED` means no food was found.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          description: Rate limit exceeded.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              description: Seconds until the next request may succeed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/labels/analyze:
    post:
      operationId: analyzeLabel
      summary: Read the nutrition facts table on a package photo
      description: |
        Transcribes the table with the AI vision provider and returns values per 100 g.
        A table printed per serving is converted with the printed serving size. Values the
        table did not show are omitted, never zero, so a client can ask the user for them.
        The values are a transcription of a photo and can be wrong: clients show them for
        confirmation before saving. Only available when `/v1/config` reports
        `labelReading: true`. Shares the analysis rate limit.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Exactly one JPEG, PNG or WebP file (detected by content) of the table.
                locale:
                  type: string
                  enum: [ru, en]
      responses:
        '200':
          description: The table, normalized to 100 g.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelResponse'
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          description: Rate limit exceeded.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              description: Seconds until the next request may succeed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/products/{barcode}:
    get:
      operationId: getProduct
      summary: Nutrition facts of a packaged product by barcode
      description: |
        Looks the product up in Open Food Facts (crowd-sourced data under the ODbL;
        `source` says so and clients should credit it). Only advertised when
        `/v1/config` reports `barcodeLookup: true`; otherwise the route does not exist.
        Products the source knows without trustworthy nutrition data are reported as
        not found. Barcodes are never logged.
      parameters:
        - name: barcode
          in: path
          required: true
          description: |
            GTIN-8, GTIN-12 (UPC-A), GTIN-13 (EAN-13) or GTIN-14, digits only, with a
            valid check digit. A UPC-A code is returned as the equivalent EAN-13.
          schema:
            type: string
            pattern: '^[0-9]{8}$|^[0-9]{12,14}$'
        - name: locale
          in: query
          required: false
          schema:
            type: string
            enum: [ru, en]
          description: Preferred language of the product name. Unknown values fall back to `en`.
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The product.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          description: Rate limit exceeded (a separate, more generous limit than analysis).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              description: Seconds until the next request may succeed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/config:
    get:
      operationId: getConfig
      summary: Client-safe tunables
      responses:
        '200':
          description: Configuration values the client may use for image preparation.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      responses:
        '200':
          description: The process is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Client-supplied correlation id, 8-64 characters of `[A-Za-z0-9-]`.
        Invalid values are replaced by a generated UUIDv7. Analyze requests
        with the same id are deduplicated (in-flight sharing and a short replay window).
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{8,64}$'
  headers:
    RequestId:
      description: Effective request id.
      schema:
        type: string
  responses:
    Error:
      description: Error. See `code` for the machine-readable reason.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AnalyzeResponse:
      type: object
      additionalProperties: false
      required: [requestId, items, warnings]
      properties:
        requestId:
          type: string
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Item'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    LabelResponse:
      type: object
      additionalProperties: false
      required: [requestId, nutrition, warnings]
      properties:
        requestId:
          type: string
        name:
          type: string
          description: Product name as printed on the package. Omitted when not read.
        servingSizeG:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 2000
          description: The serving size the package states, in grams. Omitted when unknown.
        nutrition:
          type: object
          additionalProperties: false
          description: Values per 100 g; each is omitted when the table did not show it.
          properties:
            kcalPer100g:
              type: number
              minimum: 0
              maximum: 900
            proteinPer100g:
              type: number
              minimum: 0
              maximum: 100
            fatPer100g:
              type: number
              minimum: 0
              maximum: 100
            carbsPer100g:
              type: number
              minimum: 0
              maximum: 100
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/LabelWarning'
    LabelWarning:
      type: string
      description: |
        LOW_CONFIDENCE: the provider was unsure about the digits. ENERGY_MISMATCH: the energy
        is far from what the macros imply (fibre, polyols and alcohol explain small gaps).
        ENERGY_ESTIMATED: the table showed no energy; it was computed from the macros.
        VALUES_CONVERTED: the table was per serving and was converted to 100 g.
        VOLUME_BASIS: the table was per 100 ml; the values are used as per 100 g.
      enum: [LOW_CONFIDENCE, ENERGY_MISMATCH, ENERGY_ESTIMATED, VALUES_CONVERTED, VOLUME_BASIS]
    Product:
      type: object
      additionalProperties: false
      required: [barcode, name, nutrition, source]
      properties:
        barcode:
          type: string
          description: The normalized code (EAN-13 for a UPC-A input).
        name:
          type: string
          description: Display name, at most 100 characters.
        brand:
          type: string
          description: First brand, at most 60 characters. Omitted when unknown.
        servingSizeG:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 2000
          description: Declared serving in grams. Omitted when unknown.
        nutrition:
          $ref: '#/components/schemas/Nutrition'
        source:
          type: string
          enum: [openfoodfacts]
    Item:
      type: object
      additionalProperties: false
      required: [id, name, normalizedName, estimatedWeightG, confidence, nutritionSource, nutrition]
      properties:
        id:
          type: string
          description: Unique within the response.
        name:
          type: string
          description: Display name in the requested locale.
        normalizedName:
          type: string
          description: Stable snake_case key. The catalog id when nutritionSource is `catalog`.
        estimatedWeightG:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 3000
        confidence:
          type: number
          minimum: 0
          maximum: 1
        nutritionSource:
          type: string
          enum: [catalog, ai_estimate]
        nutrition:
          $ref: '#/components/schemas/Nutrition'
    Nutrition:
      type: object
      additionalProperties: false
      required: [kcalPer100g, proteinPer100g, fatPer100g, carbsPer100g]
      properties:
        kcalPer100g:
          type: number
          minimum: 0
          maximum: 900
        proteinPer100g:
          type: number
          minimum: 0
          maximum: 100
        fatPer100g:
          type: number
          minimum: 0
          maximum: 100
        carbsPer100g:
          type: number
          minimum: 0
          maximum: 100
    Warning:
      type: string
      enum: [NO_FOOD_DETECTED, PARTIAL_RECOGNITION, LOW_CONFIDENCE, NUTRITION_ESTIMATED]
    ClientConfig:
      type: object
      additionalProperties: false
      required: [imageMaxLongSidePx, imageJpegQuality, maxUploadBytes, analyzeTimeoutSeconds, maxImages, barcodeLookup, labelReading]
      properties:
        imageMaxLongSidePx:
          type: integer
          minimum: 256
        imageJpegQuality:
          type: integer
          minimum: 30
          maximum: 100
        maxUploadBytes:
          type: integer
          minimum: 1
        analyzeTimeoutSeconds:
          type: integer
          minimum: 1
        labelReading:
          type: boolean
          description: |
            True when `POST /v1/labels/analyze` is available. Absent in responses of servers
            that predate label reading; treat that as false.
        barcodeLookup:
          type: boolean
          description: |
            True when `GET /v1/products/{barcode}` is available. Absent in responses of
            servers that predate barcode lookup; treat that as false.
        maxImages:
          type: integer
          minimum: 1
          maximum: 2
          description: |
            Photos per analyze request: 2 means an optional `sideImage` is accepted.
            Absent in responses of servers that predate the side view; treat that as 1.
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - INVALID_IMAGE
            - IMAGE_TOO_LARGE
            - UNSUPPORTED_IMAGE_FORMAT
            - RATE_LIMITED
            - AI_PROVIDER_UNAVAILABLE
            - AI_INVALID_RESPONSE
            - NUTRITION_MATCH_FAILED
            - IMAGE_ANALYSIS_FAILED
            - INTERNAL_ERROR
            - PRODUCT_NOT_FOUND
            - PRODUCT_SOURCE_UNAVAILABLE
            - LABEL_NOT_RECOGNIZED
          description: |
            HTTP status by code: INVALID_REQUEST, INVALID_IMAGE 400; IMAGE_TOO_LARGE 413;
            UNSUPPORTED_IMAGE_FORMAT 415; RATE_LIMITED 429; AI_INVALID_RESPONSE,
            NUTRITION_MATCH_FAILED, IMAGE_ANALYSIS_FAILED 502; AI_PROVIDER_UNAVAILABLE 503;
            INTERNAL_ERROR 500; PRODUCT_NOT_FOUND 404; PRODUCT_SOURCE_UNAVAILABLE 503; LABEL_NOT_RECOGNIZED 422.
        message:
          type: string
          description: Short English developer-facing text. Never contains internal details.
        requestId:
          type: string
