# CalSnap backend.
#
# By default only the backend runs and its port is published on the host.
# Serve HTTPS in one of two ways (release builds of the app accept https:// only):
#   * native TLS: set server.tls.cert_file/key_file in config.yaml and mount the
#     certificate files into the container; or
#   * behind a reverse proxy: put your own proxy in front, or enable the bundled
#     Caddy (automatic HTTPS) as described below.
#
#   1. cp config.example.yaml config.yaml and set:
#        server.environment: production
#        metrics.listen: "0.0.0.0:9090"            (reachable inside the network only)
#      and, when TLS is terminated by a proxy in front of the backend:
#        server.allow_plain_http: true
#        server.trusted_proxies: [<the proxy address or CIDR>]
#   2. Create docker/.env with:
#        GEMINI_API_KEY=<your key>          (or OPENROUTER_API_KEY / ROUTERAI_API_KEY,
#                                            matching ai.provider in config.yaml)
#   3. docker compose -f docker/compose.yaml up -d --build
#
# To use the bundled Caddy: uncomment the "caddy" service, the "networks" entries
# and the caddy_* volumes, replace "ports" of the calsnap service with
# `expose: ["8445"]` (so that only Caddy can reach it), set
# server.trusted_proxies: ["172.28.0.0/16"] (the fixed compose network) and add
# CALSNAP_DOMAIN=calsnap.example.com to docker/.env.
#
# The API key is passed as an environment variable and is never written into
# the image or the config file.

services:
  calsnap:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      # Only the key of the selected ai.provider is required; the server refuses to start without it.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
    volumes:
      - ../config.yaml:/etc/calsnap/config.yaml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "8445:8445"
